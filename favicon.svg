<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad-icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D9A8"/>
      <stop offset="0.5" stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#B4700F"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#050506"/>
  
  <!-- Stylized "P" mark -->
  <g stroke="url(#grad-icon)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical spine -->
    <line x1="18" y1="14" x2="18" y2="50"/>
    <!-- Rounded bowl -->
    <path d="M18 22 L28 22 Q36 22 36 30 Q36 38 28 38 L18 38"/>
    <!-- Small line at bottom -->
    <line x1="18" y1="50" x2="30" y2="50"/>
  </g>
  
  <!-- Sound dot with pulse animation -->
  <circle cx="38" cy="16" r="2.8" fill="url(#grad-icon)"/>
  <circle cx="38" cy="16" r="2.8" fill="url(#grad-icon)" opacity="0.3">
    <animate attributeName="r" from="2.8" to="8" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" from="0.3" to="0" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
