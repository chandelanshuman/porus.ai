<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="Porus.ai">
  <defs>
    <linearGradient id="grad-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D9A8"/>
      <stop offset="0.5" stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#B4700F"/>
    </linearGradient>
  </defs>
  
  <!-- Monogram mark: circular "P" with sound dot -->
  <g>
    <!-- Stylized "P" as a single stroke -->
    <g stroke="url(#grad-mark)" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Vertical spine of P -->
      <line x1="18" y1="12" x2="18" y2="52"/>
      <!-- Rounded bowl of P -->
      <path d="M18 20 L28 20 Q36 20 36 28 Q36 36 28 36 L18 36"/>
    </g>
    
    <!-- Sound dot: represents the "i" in "ai" and emerging audio -->
    <circle cx="38" cy="18" r="3.2" fill="url(#grad-mark)"/>
    <circle cx="38" cy="18" r="3.2" fill="url(#grad-mark)" opacity="0.3">
      <animate attributeName="r" from="3.2" to="9" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.3" to="0" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Wordmark: "Porus.ai" -->
  <text x="70" y="42" font-family="-apple-system, 'SF Pro Display', 'Inter', sans-serif" 
        font-size="32" font-weight="600" letter-spacing="-0.5" fill="#F5F5F7">
    Porus
    <tspan font-family="'SF Mono', monospace" font-size="28" font-weight="500" letter-spacing="0.2" fill="#E8A33D">.ai</tspan>
  </text>
</svg>
